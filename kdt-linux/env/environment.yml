name: vision-ai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - scikit-learn>=1.2.0
  - jupyter>=1.0.0
  - pyyaml>=6.0
  - pip
  - pip:
    - opencv-python>=4.8.0
    - torch>=2.1.0 --index-url https://download.pytorch.org/whl/cpu
    - torchvision>=0.16.0 --index-url https://download.pytorch.org/whl/cpu
    - ultralytics>=8.0.0
